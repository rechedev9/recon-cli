version: 2
builds:
  - env: [CGO_ENABLED=0]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    main: ./cmd/codestat
    ldflags: -s -w -X github.com/rechedev9/CLIClaudeCode/internal/cli.version={{ .Version }}

archives:
  - format: tar.gz
    format_overrides:
      - goos: windows
        format: zip
